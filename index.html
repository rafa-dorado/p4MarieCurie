<script>
/* ============================================================
   ESTADO COMPARTIDO DEL LABORATORIO DE MARIE CURIE
   Pasa el nombre del equipo y los fallos reales de cada sala
   de una pantalla a la siguiente mediante la URL (sin backend,
   sin localStorage). Cada pantalla LEE lo que llega y ESCRIBE
   lo suyo antes de enlazar con la siguiente.
   ============================================================ */
window.EonesiaCurie = (function () {
  function leerEstado() {
    try {
      const params = new URLSearchParams(window.location.search);
      const s = params.get('s');
      if (!s) return { equipo: '', fallos: {} };
      const json = decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
      const obj = JSON.parse(json);
      return { equipo: obj.equipo || '', fallos: obj.fallos || {} };
    } catch (e) {
      return { equipo: '', fallos: {} };
    }
  }
  function construirUrl(destino, equipo, fallosAcumulados, salaActual, fallosSala) {
    const fallos = Object.assign({}, fallosAcumulados);
    fallos[salaActual] = fallosSala;
    const payload = { equipo: equipo, fallos: fallos };
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_');
    return destino + '?s=' + b64;
  }
  function generarCodigo(equipo, fallosObj) {
    const totalFallos = Object.values(fallosObj || {}).reduce((a, b) => a + b, 0);
    let hash = 0;
    const base = (equipo || 'Aprendices') + '|' + totalFallos;
    for (let i = 0; i < base.length; i++) { hash = (hash * 31 + base.charCodeAt(i)) >>> 0; }
    const digitos = String(1000 + (hash % 9000));
    return 'RADIO-' + digitos;
  }
  return { leerEstado: leerEstado, construirUrl: construirUrl, generarCodigo: generarCodigo };
})();
</script>

function useAudio(){
  const ctxRef = useRef(null);
  useEffect(() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) ctxRef.current = new AC();
    return () => { if (ctxRef.current) ctxRef.current.close(); };
  }, []);
  const playTone = useCallback((freq, duration, type='sine') => {
    const ctx = ctxRef.current;
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0.13, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + duration);
  }, []);
  return {
    sfxError: () => playTone(170, 0.32, 'sawtooth'),
    sfxSuccess: () => { playTone(523, 0.15); setTimeout(()=>playTone(784,0.25),100); },
    sfxClick: () => playTone(660, 0.05, 'square'),
    sfxSello: () => { playTone(200, 0.08, 'square'); setTimeout(()=>playTone(150,0.12,'square'),60); },
    sfxTic: () => playTone(1800, 0.03, 'square'),
  };
}

  const [idx, setIdx] = useState(0);

  useEffect(() => { setSellado(false); }, [idx]);

                  {op}
                  {sellado && predicciones[caso.id]===i && (
                    <img src={CUADERNO_SELLO_IMG} alt="Sellado" className="anim-sellar absolute -right-3 -top-3 w-14 h-14 rounded-full object-cover border-2 shadow-lg"
                      style={{ borderColor:'#4a1e1e' }} />

              ))}

          </div>

          <NotaMarie texto={NOTAS_MARIE.fase1} />

/* -------------------------------------------------------------------------
   FASE 2 — LA LUPA (arquetipo "lente" — arrastre 2D robusto, ref+document)
   ------------------------------------------------------------------------- */
function InstrumentoBorroso({ valorReal, min, max, unidad, lens, dimRef }){
  const ancho = 300, alto = 90;
  const pct = (valorReal-min)/(max-min);
  const x = pct*(ancho-20)+10;
  const S = 3;
  const contenido = (
    <>
      <div className="absolute left-0 right-0" style={{ top:40, height:2, background:'#8a6a3a' }}/>
      {Array.from({length:11}).map((_,i) => (
        <div key={i} className="absolute" style={{ left:10+i*(ancho-20)/10, top:34, width:1, height:14, background:'#8a6a3a99' }}/>
      ))}
      <div className="absolute" style={{ left:x-1, top:16, width:2, height:50, background:'#6b2e2e' }}/>
      <span className="absolute font-mono" style={{ left:x-8, top:66, fontSize:'4px', color:'#3a2a1a' }}>{valorReal}{unidad}</span>
    </>
  );
  return (
    <div ref={dimRef} className="relative rounded-md border-2" style={{ width:ancho, height:alto, borderColor:'#8a6a3a', background:'rgba(255,255,255,0.3)' }}>
      {contenido}
      <div className="absolute rounded-full border-4 overflow-hidden pointer-events-none"
        style={{ left:lens.x-45, top:lens.y-45, width:90, height:90, borderColor:'#c9963f', background:'#fdf8ea',
          boxShadow:'0 4px 10px rgba(0,0,0,0.5), inset 0 0 14px rgba(0,0,0,0.25)' }}>
        <div style={{ transform:`translate(${45 - S*lens.x}px, ${45 - S*lens.y}px)` }}>
          <div style={{ transform:`scale(${S})`, transformOrigin:'0 0', width:ancho, height:alto, position:'relative' }}>
            {contenido}
          </div>
        </div>
      </div>
    </div>
  );
}
function Lupa2D({ lens, setLens, dimRef }){
  const pulsadoRef = useRef(false);
  const mover = (clientX, clientY) => {
    if (!dimRef.current) return;
    const rect = dimRef.current.getBoundingClientRect();
    const x = Math.max(0, Math.min(rect.width, clientX-rect.left));
    const y = Math.max(0, Math.min(rect.height, clientY-rect.top));
    setLens({ x, y });
  };
  useEffect(() => {
    const mv = (e) => { if (!pulsadoRef.current) return; const t = e.touches ? e.touches[0] : e; mover(t.clientX, t.clientY); };
    const up = () => { pulsadoRef.current = false; };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', mv, { passive:true });
    document.addEventListener('touchend', up);
    return () => {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      document.removeEventListener('touchmove', mv);
      document.removeEventListener('touchend', up);
    };
  }, []);
  const onDown = (e) => { pulsadoRef.current = true; const t = e.touches ? e.touches[0] : e; mover(t.clientX, t.clientY); };
  return (
    <div onMouseDown={onDown} onTouchStart={onDown} data-lupa="true"
      className="absolute rounded-full border-4 cursor-grab active:cursor-grabbing"
      style={{ left:lens.x-45, top:lens.y-45, width:90, height:90, borderColor:'#c9963f66' }} />
  );
}
function Phase2({ onComplete, onFail, hintText, hintAvailable, openHint, onCloseHint, sfx }){
  const [idx, setIdx] = useState(0);
  const [lens, setLens] = useState({ x:150, y:45 });
  const [flash, setFlash] = useState(null);
  const dimRef = useRef(null);
  const caso = CASOS[idx];

  useEffect(() => { setLens({x:150,y:45}); setFlash(null); }, [idx]);

  const elegirLectura = (valor) => {
    if (flash) return;
    if (valor === caso.valorReal) {
      sfx.sfxSuccess();
      setFlash('ok');
      setTimeout(() => { setFlash(null); if (idx < CASOS.length-1) setIdx(idx+1); else onComplete(); }, 800);
    } else {
      sfx.sfxError();
      setFlash('fail');
      onFail('fase2', { casoId: caso.id, elegido: valor, real: caso.valorReal });
      setTimeout(() => setFlash(null), 500);
    }
  };

  return (
    <div>
      <Escena>
        <div className="pagina p-6">
          <div className="flex items-center gap-4 mb-1">
            <img src={CUADERNO_LUPA_IMG} alt="" aria-hidden="true" className="w-16 h-16 rounded-lg object-cover border-2 border-[#8a6a3a]/50 shrink-0" />
            <p className="font-crimson text-[#2a2015] text-lg">Usa la lupa para leer el instrumento — Caso {idx+1} de {CASOS.length}</p>
          </div>

          <div className={`relative inline-block ${flash==='fail' ? 'anim-shake' : flash==='ok' ? 'anim-pulse-success' : ''}`} style={{ width:300, height:90 }}>
            <InstrumentoBorroso valorReal={caso.valorReal} min={caso.min} max={caso.max} unidad={caso.unidad} lens={lens} dimRef={dimRef}/>
            <Lupa2D lens={lens} setLens={setLens} dimRef={dimRef} />
          </div>
        </div>
      </Escena>

      <div className="mt-4 bg-black/25 rounded-lg p-4 border-l-4" style={{ borderColor:'#d4a656' }}>
        <NotaMarie texto={NOTAS_MARIE.fase2} />
      </div>

      <p className="font-mono text-[10px] text-[#f0e2c0]/50 mt-5 mb-2">¿Qué número marca?</p>
      <div className="flex gap-3 mb-4">
        {caso.opcionesLectura.map(v => (
          <button key={v} onClick={()=>elegirLectura(v)} disabled={!!flash}
            className="px-5 py-2.5 rounded-md font-mono text-sm border-2 border-[#5c3a21] bg-[#3a2a1a] text-[#f0e2c0] hover:bg-[#4a3620]">
            {v}{caso.unidad}
          </button>
        ))}
      </div>
      <button onClick={()=>hintAvailable && openHint()} disabled={!hintAvailable}
        className={`flex items-center gap-1.5 px-3 py-2 rounded-md text-xs font-mono border ${hintAvailable ? 'border-[#d4a656]/60 text-[#d4a656] bg-[#d4a656]/10' : 'border-white/10 text-white/25'}`}>
        <HelpCircle className="w-3.5 h-3.5"/> PISTA
      </button>
      <HintModal text={hintText} onClose={onCloseHint} />
    </div>
  );
}

/* -------------------------------------------------------------------------
   FASE 3 — EL CONTRASTE (predicción sellada vs. medida real + razonamiento)
   ------------------------------------------------------------------------- */
function Phase3({ onComplete, onFail, predicciones, hintText, hintAvailable, openHint, onCloseHint, sfx, registrarAcierto }){
  const [idx, setIdx] = useState(0);
  const [paso, setPaso] = useState('contraste'); // 'contraste' | 'porque'
  const [flash, setFlash] = useState(null);
  const caso = CASOS[idx];
  const prediccionCorrecta = predicciones[caso.id] === caso.correcta;

  useEffect(() => { setPaso('contraste'); setFlash(null); }, [idx]);

  const responderContraste = (dijoQueSeCumplio) => {
    if (flash) return;
    const correcto = dijoQueSeCumplio === prediccionCorrecta;
    if (correcto) {
      sfx.sfxSuccess(); setFlash('ok');
      setTimeout(() => { setFlash(null); setPaso('porque'); }, 700);
    } else {
      sfx.sfxError(); setFlash('fail');
      onFail('fase3', { casoId: caso.id, motivo:'contraste' });
      setTimeout(() => setFlash(null), 500);
    }
  };
  const responderPorque = (opcionIdx) => {
    if (flash) return;
    if (opcionIdx === caso.porqueCorrecta) {
      sfx.sfxSuccess(); setFlash('ok');
      registrarAcierto(caso.id);
      setTimeout(() => { setFlash(null); if (idx < CASOS.length-1) setIdx(idx+1); else onComplete(); }, 900);
    } else {
      sfx.sfxError(); setFlash('fail');
      onFail('fase3', { casoId: caso.id, motivo:'porque' });
      setTimeout(() => setFlash(null), 500);
    }
  };

  return (
    <div>
      <Escena>
        <div className="pagina p-6">
          <p className="font-crimson text-[#2a2015] text-lg mb-1">Caso {idx+1} de {CASOS.length}: <span style={{fontSize:'1.4rem'}}>{caso.icono}</span> {caso.narrativa}</p>
          <div className="grid sm:grid-cols-2 gap-4 my-4">
            <div className="rounded-md border-2 p-3" style={{ borderColor:'#8a6a3a', background:'rgba(255,255,255,0.25)' }}>
              <p className="font-mono text-[9px] text-[#5c3a21]/60 mb-1">TU PREDICCIÓN SELLADA</p>
              <p className="font-crimson text-[#2a2015]">{caso.opciones[predicciones[caso.id]]}</p>
            </div>
            <div className="rounded-md border-2 p-3" style={{ borderColor:'#8a6a3a', background:'rgba(255,255,255,0.25)' }}>
              <p className="font-mono text-[9px] text-[#5c3a21]/60 mb-1">MEDIDA REAL</p>
              <p className="font-crimson text-[#2a2015]">{caso.valorReal}{caso.unidad}</p>
            </div>
          </div>

          {paso === 'contraste' ? (
            <div className={`flex gap-4 ${flash==='fail' ? 'anim-shake' : flash==='ok' ? 'anim-pulse-success' : ''}`}>
              <button onClick={()=>responderContraste(true)} disabled={!!flash} className="flex-1 py-3 rounded-md font-mono text-sm border-2 border-emerald-700/60 bg-emerald-900/10 text-[#2a2015] hover:bg-emerald-900/20">SE CUMPLIÓ</button>
              <button onClick={()=>responderContraste(false)} disabled={!!flash} className="flex-1 py-3 rounded-md font-mono text-sm border-2 border-[#6b2e2e] bg-[#6b2e2e]/10 text-[#2a2015] hover:bg-[#6b2e2e]/20">NO SE CUMPLIÓ</button>
            </div>
          ) : (
            <div className={flash==='fail' ? 'anim-shake' : flash==='ok' ? 'anim-pulse-success' : ''}>
              <p className="font-crimson text-[#3a2a1a] font-semibold mb-3">{caso.preguntaPorque}</p>
              <div className="flex flex-col gap-2">
                {caso.porqueOpciones.map((op,i) => (
                  <button key={i} onClick={()=>responderPorque(i)} disabled={!!flash}
                    className="text-left px-4 py-3 rounded-md font-crimson text-sm border-2 border-[#8a6a3a] bg-white/25 text-[#2a2015] hover:bg-white/40">
                    {op}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      </Escena>

      <div className="mt-4 bg-black/25 rounded-lg p-4 border-l-4" style={{ borderColor:'#d4a656' }}>
        <NotaMarie texto={NOTAS_MARIE.fase3} />
      </div>
      <div className="mt-5">
        <button onClick={()=>hintAvailable && openHint()} disabled={!hintAvailable}
          className={`flex items-center gap-1.5 px-3 py-2 rounded-md text-xs font-mono border ${hintAvailable ? 'border-[#d4a656]/60 text-[#d4a656] bg-[#d4a656]/10' : 'border-white/10 text-white/25'}`}>
          <HelpCircle className="w-3.5 h-3.5"/> PISTA
        </button>
      </div>
      <HintModal text={hintText} onClose={onCloseHint} />
    </div>
  );
}

function VictoryScreen({ sessionLog, equipo, fallosAcumulados, urlSiguiente }){

    const report = { ...sessionLog, durationSec: Math.round((Date.now()-sessionLog.startTime)/1000) };
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const mins = Math.floor(report.durationSec/60), secs = report.durationSec%60;
    doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.setTextColor(43,32,21);
    doc.text('El Laboratorio de Marie Curie', 20, 22);
    doc.setFontSize(12); doc.setTextColor(90,90,90);

    doc.text(`Duración de la sesión: ${mins} min ${secs} s`, 20, 48);

    const nombres = { fase1:'Fase 1 · Predicción Sellada', fase2:'Fase 2 · La Lupa', fase3:'Fase 3 · El Contraste' };
    Object.keys(report.attemptsPerPhase).forEach(f => {
      doc.text(`${nombres[f]}: ${report.attemptsPerPhase[f]} intento(s) fallido(s)`, 25, y);
      y += 8;
    });
    y += 6;
    doc.setFont('helvetica','bold'); doc.text(`Pistas utilizadas: ${report.hintsUsed.length}`, 20, y); y += 12;
    doc.setFont('helvetica','bold'); doc.setTextColor(107,46,46);

    doc.setFontSize(9); doc.setTextColor(150,150,150);

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--hierro)'}}>
      <div className="max-w-lg w-full text-center">
        <Sparkles className="w-10 h-10 mx-auto mb-3" style={{ color:'#d4a656' }}/>

        <div className={`mx-auto max-w-xs p-5 rounded-lg border-2 mb-6 ${revelado ? 'anim-pop-in' : 'opacity-0'}`} style={{ borderColor:'#d4a656', background:'rgba(212,166,86,0.08)' }}>
          <p className="font-mono text-[10px] text-[#d4a656]/70 mb-2 flex items-center justify-center gap-1.5"><KeyRound className="w-3.5 h-3.5"/> CÓDIGO DE ACCESO AL TRIBUNAL</p>
          <p className="font-mono text-2xl text-[#f0e2c0] tracking-widest">{codigoAcceso}</p>
          <p className="font-mono text-[9px] text-[#f0e2c0]/40 mt-2">Lo necesitarás si entráis al Tribunal por separado. El enlace de abajo ya lo lleva incluido.</p>
        </div>

        <div className="flex flex-col gap-3 items-center">
          <a href={urlSiguiente}
            className="w-full max-w-xs py-3 rounded-md font-mono text-sm tracking-wide bg-[#d4a656] text-[#1c1a18] font-semibold hover:bg-[#e8c07a] transition-colors flex items-center justify-center gap-2">
            Continuar al Tribunal de la Academia →
          </a>
          <button onClick={download} className="px-4 py-2 rounded-md font-mono text-xs border border-[#d4a656]/50 text-[#d4a656] hover:bg-[#d4a656]/10 flex items-center gap-2">
            <Download className="w-3.5 h-3.5"/> descargar informe de sesión (.pdf)
          </button>
        </div>
      </div>
    </div>
  );
}

/* -------------------------------------------------------------------------
   APP RAÍZ
   ------------------------------------------------------------------------- */
function App(){
  const estadoEntrante = useMemo(() => window.EonesiaCurie.leerEstado(), []);
  const [screen, setScreen] = useState('intro');
  const [equipo, setEquipo] = useState(estadoEntrante.equipo || '');
  const [currentPhase, setCurrentPhase] = useState(1);
  const [memoria, setMemoria] = useState(3);
  const [soundOn, setSoundOn] = useState(true);
  const [hintText, setHintText] = useState(null);
  const [predicciones, setPredicciones] = useState({});
  const attemptHistory = useRef({ fase1:[], fase2:[], fase3:[] });
  const sfxReal = useAudio();
  const sfx = useMemo(() => soundOn ? sfxReal : { sfxError(){}, sfxSuccess(){}, sfxClick(){}, sfxSello(){}, sfxTic(){} }, [soundOn, sfxReal]);
  const [sessionLog] = useState({ startTime: Date.now(), attemptsPerPhase:{fase1:0,fase2:0,fase3:0}, livesLostPerPhase:{fase1:0,fase2:0,fase3:0}, hintsUsed:[], aciertosContraste:[] });

  const hintAvailable = attemptHistory.current[`fase${currentPhase}`].length >= 2;
  const openHint = () => {
    const key = `fase${currentPhase}`;
    setHintText(getHint(key, attemptHistory.current[key]));
    sessionLog.hintsUsed.push({ phase:key, at:Date.now() });
  };
  const closeHint = () => setHintText(null);
  const registrarFallo = (phase, detalle) => {
    attemptHistory.current[phase].push({ correcto:false, ...detalle });
    sessionLog.attemptsPerPhase[phase]++;
    sessionLog.livesLostPerPhase[phase]++;
    /* derecho al error total: sin reinicio */
  };
  const registrarAcierto = (casoId) => { sessionLog.aciertosContraste.push(casoId); };
  const avanzarFase = () => { if (currentPhase<3) setCurrentPhase(p=>p+1); else setScreen('victory'); };

  if (screen === 'intro') return <Intro equipoEntrante={estadoEntrante.equipo} onStart={(nombreEquipo)=>{ setEquipo(nombreEquipo); setScreen('game'); }} />;
  if (screen === 'victory') {
    const totalFallos = Object.values(sessionLog.livesLostPerPhase).reduce((a,b)=>a+b,0);
    const fallosAcumulados = Object.assign({}, estadoEntrante.fallos, { cuaderno: totalFallos });
    const urlSiguiente = window.EonesiaCurie.construirUrl('tribunal.html', equipo, estadoEntrante.fallos, 'cuaderno', totalFallos);
    return <VictoryScreen sessionLog={sessionLog} equipo={equipo} fallosAcumulados={fallosAcumulados} urlSiguiente={urlSiguiente} />;
  }

  return (
    <div className="min-h-screen" style={{background:'var(--hierro)'}}>
      <HUD memoria={memoria} currentPhase={currentPhase} soundOn={soundOn} toggleSound={()=>setSoundOn(s=>!s)} />
      <PhaseTabs currentPhase={currentPhase} />
      <div className="max-w-4xl mx-auto px-4 sm:px-8 py-8">
        {currentPhase === 1 && <Phase1 onComplete={avanzarFase} predicciones={predicciones} setPredicciones={setPredicciones} hintText={hintText} openHint={openHint} onCloseHint={closeHint} hintAvailable={hintAvailable} sfx={sfx} />}
        {currentPhase === 2 && <Phase2 onComplete={avanzarFase} onFail={registrarFallo} hintText={hintText} openHint={openHint} onCloseHint={closeHint} hintAvailable={hintAvailable} sfx={sfx} />}
        {currentPhase === 3 && <Phase3 onComplete={avanzarFase} onFail={registrarFallo} predicciones={predicciones} hintText={hintText} openHint={openHint} onCloseHint={closeHint} hintAvailable={hintAvailable} sfx={sfx} registrarAcierto={registrarAcierto} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
